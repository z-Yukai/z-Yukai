<svg xmlns="http://www.w3.org/2000/svg" width="720" height="46" viewBox="0 0 720 46" role="img" aria-label="Turning behavior logs into decisions">
  <style>
    text { font-family: 'Fira Code','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace; font-size: 21px; font-weight: 600; fill: #2F81F7; }
    .cursor { fill: #2F81F7; }
  </style>
  <g>
    <text x="10" y="30" opacity="0">Turning behavior logs into decisions
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.02;0.31;0.33" dur="15s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="10" y="30" opacity="0">Funnel · RFM · Clustering
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.02;0.31;0.33" dur="15s" begin="5s" repeatCount="indefinite"/>
    </text>
    <text x="10" y="30" opacity="0">Reproducible first, charts always
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.02;0.31;0.33" dur="15s" begin="10s" repeatCount="indefinite"/>
    </text>
  </g>
  <rect class="cursor" x="10" y="38" width="10" height="3" rx="1.5">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
